name: Build Debian Package

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_PAT }}

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libreadline-dev dpkg-dev

      - name: Prepare package structure
        run: |
          make bonus
          mv minishell_bonus minishell

          VERSION=${GITHUB_REF#refs/tags/v}
          mkdir -p minishell_${VERSION}/DEBIAN
          mkdir -p minishell_${VERSION}/usr/bin
          cp minishell minishell_${VERSION}/usr/bin/

          cat <<EOF > minishell_${VERSION}/DEBIAN/control
          Package: minishell
          Version: ${VERSION}
          Section: shells
          Priority: optional
          Architecture: amd64
          Maintainer: Yaşam Ensar Demirkıran <yedemirkiran27@email.com>
          Depends: libc6 (>= 2.34), libreadline8, libtinfo6
          Suggests: valgrind
          Homepage: https://github.com/YeDemirkiran/42-minishell
          Vcs-Git: https://github.com/YeDemirkiran/42-minishell.git
          Vcs-Browser: https://github.com/YeDemirkiran/42-minishell
          Custom Bash-like shell written in C (42 project)
           A minimal Unix shell implementing builtins, pipes,
           redirections, heredoc, conditionals, subshells and signal handling.
           .
           Developed as part of the 42 curriculum.
          EOF

          # Fix permissions
          find minishell_${VERSION} -type d -exec chmod 755 {} \;
          find minishell_${VERSION} -type f -exec chmod 644 {} \;

          chmod 755 minishell_${VERSION}/usr/bin/minishell
          chmod 644 minishell_${VERSION}/DEBIAN/control

      - name: Build .deb package
        run: |
          dpkg-deb --build --root-owner-group minishell_${VERSION}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: minishell_${{ github.ref_name }}.deb
