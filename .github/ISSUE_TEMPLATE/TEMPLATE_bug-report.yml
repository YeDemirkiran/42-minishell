name: Bug Report
description: Bir hatayı bildir
title: "[Bug]: Kısa açıklama"
labels: ["Bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Hata açıklaması
      description: Ne oldu? Beklenen neydi?
      placeholder: Kısa ama yeterli detay
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Tekrarlama adımları
      placeholder: |
        1. ...
        2. ...
        3. Sonuç: ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Beklenen davranış
    validations:
      required: false
  - type: textarea
    id: actual
    attributes:
      label: Gerçekleşen çıktı
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Ek bilgi (log / ekran görüntüsü / commit)
    validations:
      required: false