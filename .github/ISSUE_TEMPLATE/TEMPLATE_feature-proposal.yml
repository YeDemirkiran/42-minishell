name: Feature Proposal
description: Yeni özellik öner
title: "[Feature]: Kısa başlık"
labels: ["Features"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Özet
      placeholder: Özelliğin kısa tanımı
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Neden gerekli?
      placeholder: Çözmek istediğin problem
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Örnek kullanım
      placeholder: Komut veya senaryo örnekleri
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Ek not / taslak düşünceler
    validations:
      required: false