name: General Request
description: Yardım / açıklama isteği
title: "[Request]: Kısa başlık"
labels: ["Request"]
body:
  - type: textarea
    id: question
    attributes:
      label: Talep / Soru
      placeholder: Anlaşılır tek cümle veya madde
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Arka plan / Denediklerin
      placeholder: Ne denedin? Nerede takıldın?
    validations:
      required: false
  - type: textarea
    id: code
    attributes:
      label: İlgili kod (varsa)
      render: c
      placeholder: Kod bloğunu buraya yapıştır
    validations:
      required: false